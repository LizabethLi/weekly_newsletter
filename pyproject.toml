[project]
name = "weekly-newsletter"
version = "0.1.0"
description = "Automated workflow to fetch AI articles and generate categorized newsletter summaries."
authors = [{ name = "Weekly Newsletter Bot" }]
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
]

[project.scripts]
newsletter = "newsletter.cli:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
